<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Things We Break</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Title -->
    <h1>Things We Break</h1>

    <h6>localStorage.clear();</h6>
    
    <!-- Shelf link -->
    <a href="shelf.html" class="shelf-link">
        Shelf
    </a>

    <!-- Main horizontal slider -->
    <main class="slider" id="slider">

        <!-- Plate -->
        <section class="object-page">

            <img
                src="assets/images/plate1.png"
                alt="Plate"
                class="object-image"
            >

        </section>


        <!-- Glass -->
        <section class="object-page">

            <img
                id="glass"
                src="assets/images/glass1.png"
                alt="Glass"
                class="object-image"
            >

        </section>


        <!-- Flower -->
        <section class="object-page">

            <img
                src="assets/images/flower1.png"
                alt="Flower"
                class="object-image"
            >

        </section>

    </main>


    <!-- Instruction -->
    <p class="instruction">
        Swipe to explore · Click to break
    </p>


    <script src="script.js"></script>

</body>

</html>
