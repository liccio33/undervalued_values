<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Please Handle With Care</title>

    <link
        rel="stylesheet"
        href="index.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/index-fav.png"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body {
            opacity: 1;

            transition:
                opacity 0.7s ease;
        }

        body.fade-out {
            opacity: 0;
        }

        .opening-page {
            position: relative;

            display: block;

            width: 100vw;
            height: 100vh;

            cursor: none;
        }

        .box-background {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0;

            transition:
                opacity 0.8s ease;

            z-index: 1;
        }

        .care-text {
            position: absolute;

            top: 70%;
            left: 30%;

            width: 720px;
            max-width: 65vw;
            height: auto;

            transform:
                translate(-50%, -50%);

            opacity: 0;

            transition:
                opacity 0.8s ease;

            z-index: 2;

            pointer-events: none;
        }

        .opening-page.loaded
        .box-background {
            opacity: 1;
        }

        .opening-page.loaded
        .care-text {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <a
        href="broken.html"
        class="opening-page"
        id="openingPage"
    >

        <img
            src="assets/images/box.png"
            alt="Box"
            class="box-background"
            id="boxBackground"
        >

        <img
            src="assets/images/please handle with care.png"
            alt="Please handle with care"
            class="care-text"
        >

        <p class="cut-instruction">
            hold and drag to open →
        </p>

        <img
            id="scissorCursor"
            src="assets/images/scissor.png"
            alt=""
        >

    </a>


    <script>
        const openingPage =
            document.getElementById(
                "openingPage"
            );

        const boxBackground =
            document.getElementById(
                "boxBackground"
            );

        boxBackground.addEventListener(
            "load",
            function () {

                openingPage.classList.add(
                    "loaded"
                );

            }
        );

        boxBackground.addEventListener(
            "error",
            function () {

                console.log(
                    "box.png 找不到，请检查图片路径"
                );

            }
        );
    </script>


    <script>
        const scissorCursor =
            document.getElementById(
                "scissorCursor"
            );

        let isCutting = false;
        let isLeaving = false;

        const boxScratchSound =
            new Audio(
                "assets/audio/BOX_125782__alienistcog__cardboard-scratches.mp3"
            );

        boxScratchSound.loop = true;
        boxScratchSound.volume = 0.6;


        function startScratchSound() {

            boxScratchSound.currentTime = 0;

            const playPromise =
                boxScratchSound.play();

            if (playPromise !== undefined) {

                playPromise.catch(
                    function () {

                        console.log(
                            "音效播放失败"
                        );

                    }
                );

            }

        }


        function stopScratchSound() {

            boxScratchSound.pause();

            boxScratchSound.currentTime = 0;

        }


        let startX = 0;

        const centerTolerance = 100;

        openingPage.addEventListener(
            "mousemove",
            function (event) {

                scissorCursor.style.left =
                    event.clientX + "px";

                scissorCursor.style.top =
                    event.clientY + "px";

                if (!isCutting) return;

                const isStillInCenter =
                    Math.abs(
                        event.clientY -
                        window.innerHeight / 2
                    ) <= centerTolerance;

                const distance =
                    event.clientX - startX;

                const hasReachedRightSide =
                    event.clientX >=
                    window.innerWidth * 0.88;

                const hasMovedRight =
                    event.clientX > startX;

                if (
                    isCutting &&
                    isStillInCenter &&
                    hasMovedRight &&
                    hasReachedRightSide
                ) {

                    goToNextPage();

                }

            }
        );


        openingPage.addEventListener(
            "mousedown",
            function (event) {

                const isInCenter =
                    Math.abs(
                        event.clientY -
                        window.innerHeight / 2
                    ) <= centerTolerance;

                const isAtLeftSide =
                    event.clientX <=
                    window.innerWidth * 0.12;

                if (
                    !isInCenter ||
                    !isAtLeftSide
                ) {
                    return;
                }

                event.preventDefault();

                isCutting = true;

                startX = event.clientX;
                startY = event.clientY;

                startScratchSound();

                scissorCursor.classList.add(
                    "cutting"
                );

            }
        );


        window.addEventListener(
            "mouseup",
            function () {

                isCutting = false;

                stopScratchSound();

                scissorCursor.classList.remove(
                    "cutting"
                );

            }
        );


        openingPage.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

            }
        );


        function goToNextPage() {

            if (isLeaving) return;

            isLeaving = true;

            stopScratchSound();

            window.location.href =
                "broken.html";

        }
    </script>

</body>

</html>
