<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Broken Things</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Title -->
    <h1 class="logo-title">

        <span class="logo-hover">

            <img
                class="logo-image"
                src="assets/images/logo.png"
                alt="Logo"
            >

            <img
                class="logo-glitch"
                src="assets/images/scribble-transparent.gif"
                alt=""
            >

        </span>

    </h1>


    <h6>localStorage.clear();</h6>
    
    <!-- Shelf link -->
    <a href="shelf.html" class="shelf-link">
        Shelf
    </a>

    <!-- Main horizontal slider -->

    <!-- Left arrow -->
    <button
        id="leftArrow"
        class="slider-arrow left-arrow"
        type="button"
    >
        <img
            src="assets/images/left.png"
            alt="Previous"
        >
    </button>


    <!-- Right arrow -->
    <button
        id="rightArrow"
        class="slider-arrow right-arrow"
        type="button"
    >
        <img
            src="assets/images/right.png"
            alt="Next"
        >
    </button>
    
    <main class="slider" id="slider">

        <!-- Plate -->
        <section class="object-page">

            <img
                id="plate"
                src="assets/images/plate1.png"
                alt="Plate"
                class="object-image"
            >

        </section>


        <!-- Glass -->
        <section class="object-page">

            <img
                id="glass"
                src="assets/images/glass1.png"
                alt="Glass"
                class="object-image"
            >

        </section>


        <!-- Flower -->
        <section class="object-page">

            <img
                id="flower"
                src="assets/images/flower1.png"
                alt="Flower"
                class="object-image"
            >

        </section>


        <!-- Bubble -->
        <section class="object-page">

            <img
                id="bubble"
                src="assets/images/bubble1.png"
                 alt="Bubble"
                 class="object-image"
            >

        </section>


        <!-- Polaroid -->
        <section class="object-page">

            <img
                id="polaroid"
                src="assets/images/polaroid1.png"
                alt="Polaroid"
                class="object-image"
            >

        </section>


        <!-- Can -->
        <section class="object-page">

            <img
                id="can"
                src="assets/images/can1.png"
                alt="Can"
                class="object-image"
            >

        </section>


        <!-- Paper -->
        <section class="object-page">

            <img
                id="paper"
                src="assets/images/paper1.png"
                alt="Paper"
                class="object-image"
            >

        </section>

        <!-- Teddy -->
        <section class="object-page">

            <img
                id="teddy"
                src="assets/images/teddy1.png"
                alt="Teddy"
                class="object-image"
            >

        </section>
</section>

    </main>


    <!-- Instruction -->
    <p class="instruction">
        Swipe to explore · Click to break
    </p>


    <script src="script.js"></script>

</body>

</html>
