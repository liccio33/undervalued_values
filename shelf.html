<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shelf</title>

    <link rel="stylesheet" href="shelf.css">
</head>

<body>

    <!-- Back -->
    <a href="index.html" class="back">
        ← Back
    </a>


    <!-- Shelf -->
    <main class="shelf">

        <!-- Shelf background image -->
        <img
            src="assets/images/shelf.jpg"
            alt="Shelf"
            class="shelf-background"
        >


        <!-- Glass -->
        <img
            id="shelfGlass"
            src="assets/images/glass1.png"
            alt="Glass"
            class="shelf-object glass"
        >


        <!-- Plate -->
        <img
            id="shelfPlate"
            src="assets/images/plate1.png"
            alt="Plate"
            class="shelf-object plate"
        >


        <!-- Flower -->
        <img
            id="shelfFlower"
            src="assets/images/flower1.png"
            alt="Flower"
            class="shelf-object flower"
        >

    </main>


    <script src="shelf.js"></script>

</body>

</html>
