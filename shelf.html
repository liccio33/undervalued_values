<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shelf</title>

    <link rel="stylesheet" href="shelf.css">
</head>

<body>

    <!-- Back -->
    <a href="broken.html" class="back">
        ← 8@ↄk
    </a>


    <!-- Shelf -->
    <main class="shelf">

        <!-- Shelf background image -->
        <img
            id="shelfBackground"
            src="assets/images/shelf.png"
            alt="Shelf"
            class="shelf-background"
        >




        <!-- Glass -->
        <img
            id="shelfGlass"
            src="assets/images/glass1.png"
            alt="Glass"
            class="shelf-object glass"
        >


        <!-- Plate -->
        <img
            id="shelfPlate"
            src="assets/images/plate1.png"
            alt="Plate"
            class="shelf-object plate"
        >


        <!-- Flower -->
        <img
            id="shelfFlower"
            src="assets/images/flower1.png"
            alt="Flower"
            class="shelf-object flower"
        >

        <!-- Bubble -->
        <img
            id="shelfBubble"
            src="assets/images/bubble1.png"
            alt="Bubble"
            class="shelf-object bubble"
        >

        <!-- Polaroid -->
        <img
            id="shelfPolaroid"
            src="assets/images/polaroid1.png"
            alt="Polaroid"
            class="shelf-object polaroid"
        >

        <!-- Can -->
        <img
            id="shelfCan"
            src="assets/images/can1.png"
            alt="Can"
            class="shelf-object can"
        >

        <!-- Paper -->
        <img
            id="shelfPaper"
            src="assets/images/paper1.png"
            alt="Paper"
            class="shelf-object paper"
        >

        <!-- Teddy -->
        <img
            id="shelfTeddy"
            src="assets/images/teddy1.png"
            alt="Teddy"
            class="shelf-object teddy"
        >

        <!-- Tape -->
        <img
            id="shelfTape"
            src="assets/images/tape1.png"
            alt="Tape"
            class="shelf-object tape"
        >


        <!-- Lego -->
        <img
            id="shelfLego"
            src="assets/images/lego1.png"
            alt="Lego"
            class="shelf-object lego"
        >


        <!-- Clock -->
        <img
            id="shelfClock"
            src="assets/images/clock1.png"
            alt="Clock"
            class="shelf-object clock"
        >


        <!-- Final shelf ending -->
        <div
            id="shelfEnding"
            class="shelf-ending"
        >

            <div
                id="shelfDialogue"
                class="shelf-dialogue"
            >

                <img
                    src="assets/images/shelf_nar.png"
                    alt=""
                    class="shelf-nar"
                >

                <p
                    id="shelfEndingText"
                    class="shelf-ending-text"
                ></p>

                <img
                    id="shelfArrow"
                    src="assets/images/arrow.png"
                    alt="Continue"
                    class="shelf-arrow"
                >

            </div>


            <img
                id="shelfHands"
                src="assets/images/hands.png"
                alt=""
                class="shelf-hands"
            >

            <img
                id="shelfHammer"
                src="assets/images/hammer.png"
                alt="Hammer"
                class="shelf-hammer"
            >

            <span
                id="shelfSpaceHint"
                class="shelf-space-hint"
            >
                [space]
            </span>

        </div>
    </main>


    <script src="shelf.js"></script>

</body>

</html>
